# H2 File-Based Persistent Database Profile
# Data is stored in ./data/hockeyconnect_db relative to the backend working directory
spring.datasource.url=jdbc:h2:file:./data/hockeyconnect_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# 'update' preserves existing data across restarts; 'create-drop' would erase on shutdown
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# H2 Console (access at http://localhost:8080/api/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
